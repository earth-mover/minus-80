[project]
name = "virtual-ome"
version = "0.1.0"
description = "Assemble OME-Zarr hierarchies over virtual (byte-range) arrays."
requires-python = ">=3.12"
dependencies = [
    "ngff-zarr>=0.46",
    "ome-zarr-models>=1.8",
    "jsonschema",
    "numpy>=2.1",
    "zarr>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_ome"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "icechunk>=2.2",
    "pytest>=8",
]
