[project]
name = "virtual-core"
version = "0.1.0"
description = "Shared spine for the bio-virtualization subprojects: archetype builders (flat-binary / HDF5 / tiled-image), object-store registry glue, and Icechunk write/open helpers."
requires-python = ">=3.12"
dependencies = [
    # The virtualization substrate: ManifestArray/ManifestGroup/ChunkManifest +
    # create_v3_array_metadata. This is what every subproject builds references into.
    "virtualizarr>=2.6.2",
    "zarr>=3.1.0",
    "numpy>=2.1.0",
    # Object-store registry + buffered reader used by the parsers (local + cloud).
    "obspec-utils",
    "obstore>=0.7.0",
    # Persist references transactionally.
    "icechunk>=0.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# virtual_core.multiscale (hybrid virtual base + native ngff-zarr pyramid). Optional
# so the base package stays lean for non-imaging formats (e.g. NWB).
imaging = ["ngff-zarr>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_core"]

[tool.uv]
package = true
