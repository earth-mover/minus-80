[project]
name = "minus-80"
version = "0.0.0"
description = "Tooling and scripts for zero-copy ingest of biology data into Icechunk."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.3.0,<2.4",
    "jsonschema",
    "ngff-zarr>=0.46",
    "numpy>=2.1",
    "obspec-utils",
    "obstore>=0.7.0",
    "ome-zarr-models>=1.8",
    "virtualizarr>=2.8.0",
    "zarr>=3.1.0",
]

[project.optional-dependencies]
nd2 = ["nd2>=0.10"]
tiff = ["imagecodecs>=2026.1", "imagecodecs-zarr", "tifffile>=2025.1.1"]
zip = []

[dependency-groups]
dev = ["imagecodecs", "imagecodecs-zarr", "pytest>=8", "safetensors", "tifffile>=2025.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minus80"]

[tool.uv.workspace]
members = ["ingests/*"]

[tool.uv.sources]
# v2.8.0 plus zarr-developers/VirtualiZarr#1108 (ManifestStore.to_icechunk) and
# the numpy-style stack/expand_dims and with_dimension_names commits.
virtualizarr = { git = "https://github.com/ianhi/VirtualiZarr", rev = "83da047711558dfb4fc004db45641d28a6687f61" }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["network: reads a real file over HTTPS"]
