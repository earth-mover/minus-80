[project]
name = "opencell-ingest"
version = "0.0.0"
description = "Ingest the OpenCell live-cell image atlas (s3://czb-opencell) into a virtual Icechunk store."
requires-python = ">=3.12"
dependencies = [
    "arraylake>=1.7.0",
    "minus-80[tiff]",
    "tifffile>=2025.1.1",
]

[tool.uv]
package = false

[dependency-groups]
notebook = ["ipykernel", "matplotlib", "pandas"]
