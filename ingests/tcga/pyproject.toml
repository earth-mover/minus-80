[project]
name = "tcga-ingest"
version = "0.0.0"
description = "Ingest TCGA whole-slide images, as NCI Imaging Data Commons publishes them in DICOM, into a virtual Icechunk store."
requires-python = ">=3.12"
dependencies = [
    "arraylake>=1.7.0",
    "idc-index==0.13.5",
    "minus-80[dicom]",
]

[tool.uv]
package = false

[dependency-groups]
notebook = ["ipykernel", "matplotlib"]
