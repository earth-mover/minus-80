[project]
name = "chammi-75-ingest"
version = "0.0.0"
description = "Reference the permissively licensed studies of the CHAMMI-75 training set (s3://chammi-data) as virtual OME-Zarr in Icechunk."
requires-python = ">=3.12"
dependencies = [
    "arraylake>=1.7.0",
    "duckdb>=1.1",
    "imagecodecs>=2026.1",
    "imagecodecs-zarr",
    "minus-80[zip]",
    "pandas>=2.2",
    "pillow>=11",
    "safetensors>=0.4",
]

[tool.uv]
package = false

[dependency-groups]
notebook = ["ipykernel", "matplotlib"]
